  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const leagueBtns = document.querySelectorAll('[data-league]');
      const container = document.getElementById('football-matches-list');

      let currentLeague = 'eng.1';

      async function fetchFootball(league) {
        container.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-dim);">Đang tải lịch thi đấu ESPN...</div>';

        try {
          const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard`;
          const res = await fetch(url);
          if (!res.ok) throw new Error();
          const data = await res.json();
          const events = data.events || [];

          if (events.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);">Không có trận đấu nào hôm nay trong giải này.</div>';
            return;
          }

          container.innerHTML = events.slice(0, 10).map(ev => {
            const comp = ev.competitions && ev.competitions[0];
            if (!comp) return '';

            const home = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
            const away = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];
            const status = comp.status;
            const state = status.type.state;

            let centerHtml = '';
            if (state === 'in') {
              centerHtml = `
                <div style="font-family:var(--font-mono); font-size:1.3rem; font-weight:800; color:var(--neon-cyan);">${home.score || 0} - ${away.score || 0}</div>
                <span class="badge-pill" style="color:var(--neon-green); border-color:var(--neon-green); font-size:0.65rem;">● LIVE ${status.displayClock || ''}</span>
              `;
            } else if (state === 'post') {
              centerHtml = `
                <div style="font-family:var(--font-mono); font-size:1.3rem; font-weight:800; color:var(--text-title);">${home.score || 0} - ${away.score || 0}</div>
                <span class="badge-pill" style="font-size:0.65rem; color:var(--text-dim);">FT (Hết giờ)</span>
              `;
            } else {
              const matchDate = new Date(comp.date);
              const timeStr = matchDate.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Ho_Chi_Minh' });
              const dateStr = matchDate.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', timeZone: 'Asia/Ho_Chi_Minh' });
              centerHtml = `
                <div style="font-family:var(--font-mono); font-size:1.1rem; font-weight:800; color:var(--neon-green);">${timeStr}</div>
                <span style="font-size:0.75rem; color:var(--text-dim);">${dateStr}</span>
              `;
            }

            const homeLogo = home.team.logo || '/favicon.svg';
            const awayLogo = away.team.logo || '/favicon.svg';

            return `
              <div class="port-item-card" style="align-items:center; justify-content:space-between; padding:0.85rem 1rem;">
                <div style="display:flex; align-items:center; gap:0.6rem; flex:1;">
                  <img src="${homeLogo}" alt="${home.team.displayName}" style="width:28px; height:28px; object-fit:contain;" onerror="this.style.opacity=0.3;">
                  <strong style="font-size:0.85rem; color:var(--text-title);">${home.team.shortDisplayName || home.team.displayName}</strong>
                </div>
                <div style="text-align:center; min-width:90px;">
                  ${centerHtml}
                </div>
                <div style="display:flex; align-items:center; gap:0.6rem; flex:1; justify-content:flex-end;">
                  <strong style="font-size:0.85rem; color:var(--text-title); text-align:right;">${away.team.shortDisplayName || away.team.displayName}</strong>
                  <img src="${awayLogo}" alt="${away.team.displayName}" style="width:28px; height:28px; object-fit:contain;" onerror="this.style.opacity=0.3;">
                </div>
              </div>
            `;
          }).join('');
        } catch {
          container.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-dim);">Không thể tải dữ liệu bóng đá ESPN. Vui lòng thử lại sau!</div>';
        }
      }

      leagueBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          leagueBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLeague = btn.getAttribute('data-league');
          fetchFootball(currentLeague);
        });
      });

      fetchFootball(currentLeague);
    });
  </script>
