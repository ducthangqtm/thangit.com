  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('world-clock-container');
      if (!container) return;

      const CITIES = [
        { city: 'Hà Nội / TP.HCM', country: '🇻🇳 Việt Nam', tz: 'Asia/Ho_Chi_Minh', offset: 0 },
        { city: 'Tokyo', country: '🇯🇵 Nhật Bản', tz: 'Asia/Tokyo', offset: 2 },
        { city: 'Singapore', country: '🇸🇬 Singapore', tz: 'Asia/Singapore', offset: 1 },
        { city: 'London', country: '🇬🇧 Vương Quốc Anh', tz: 'Europe/London', offset: -6 },
        { city: 'Frankfurt / Paris', country: '🇩🇪 Đức / Pháp', tz: 'Europe/Berlin', offset: -5 },
        { city: 'New York', country: '🇺🇸 Mỹ (EST)', tz: 'America/New_York', offset: -11 },
        { city: 'San Francisco', country: '🇺🇸 Silicon Valley', tz: 'America/Los_Angeles', offset: -14 },
        { city: 'Sydney', country: '🇦🇺 Úc (AEST)', tz: 'Australia/Sydney', offset: 3 }
      ];

      function renderClocks() {
        const now = new Date();
        container.innerHTML = CITIES.map(c => {
          const timeFormatter = new Intl.DateTimeFormat('vi-VN', {
            timeZone: c.tz,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          });
          const dateFormatter = new Intl.DateTimeFormat('vi-VN', {
            timeZone: c.tz,
            weekday: 'short',
            day: '2-digit',
            month: '2-digit'
          });

          const timeStr = timeFormatter.format(now);
          const dateStr = dateFormatter.format(now);

          const hourOnly = parseInt(timeStr.split(':')[0], 10);
          const isDay = hourOnly >= 6 && hourOnly < 18;
          const dayNightIcon = isDay ? '☀️' : '🌙';

          let offsetLabel = '';
          if (c.offset === 0) offsetLabel = 'Giờ hiện tại của bạn';
          else if (c.offset > 0) offsetLabel = `Nhanh hơn ${c.offset} tiếng`;
          else offsetLabel = `Chậm hơn ${Math.abs(c.offset)} tiếng`;

          return `
            <div class="port-item-card" style="flex-direction:column; align-items:stretch; padding:1rem; gap:0.4rem;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:700; font-size:0.9rem; color:var(--text-title);">${c.city}</span>
                <span style="font-size:1.1rem;">${dayNightIcon}</span>
              </div>
              <div style="font-family:var(--font-mono); font-size:1.6rem; font-weight:800; color:var(--neon-cyan); letter-spacing:0.02em;">
                ${timeStr}
              </div>
              <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-dim);">
                <span>${c.country} • ${dateStr}</span>
                <span>${offsetLabel}</span>
              </div>
            </div>
          `;
        }).join('');
      }

      renderClocks();
      setInterval(renderClocks, 1000);
    });
  </script>
</body>
