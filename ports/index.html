            <div class="port-filter-tags">
              <button class="port-tag-btn active" data-filter="all">Tất Cả</button>
              <button class="port-tag-btn" data-filter="web">Web</button>
              <button class="port-tag-btn" data-filter="mail">Email</button>
              <button class="port-tag-btn" data-filter="remote">Remote / SSH</button>
              <button class="port-tag-btn" data-filter="db">Database</button>
              <button class="port-tag-btn" data-filter="vpn">VPN / Sec</button>

  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('port-search-input');
      const filterBtns = document.querySelectorAll('.port-tag-btn');
      const listContainer = document.getElementById('port-list-items');

      const PORTS_DATA = [
        { port: 20, proto: 'TCP', service: 'FTP Data', cat: 'net', desc: 'Truyền dữ liệu tệp FTP' },
        { port: 21, proto: 'TCP', service: 'FTP Control', cat: 'net', desc: 'Điều khiển phiên truyền tệp FTP' },
        { port: 22, proto: 'TCP', service: 'SSH / SFTP', cat: 'remote', desc: 'Secure Shell truy cập server & sao chép tệp mã hóa' },
        { port: 23, proto: 'TCP', service: 'Telnet', cat: 'remote', desc: 'Truy cập dòng lệnh không mã hóa (legacy)' },
        { port: 25, proto: 'TCP', service: 'SMTP', cat: 'mail', desc: 'Gửi thư điện tử giữa các mail server' },
        { port: 53, proto: 'TCP/UDP', service: 'DNS', cat: 'net', desc: 'Hệ thống phân giải tên miền thành địa chỉ IP' },
        { port: 67, proto: 'UDP', service: 'DHCP Server', cat: 'net', desc: 'Cấp phát IP động tự động từ Router/Server' },
        { port: 68, proto: 'UDP', service: 'DHCP Client', cat: 'net', desc: 'Nhận cấu hình IP động từ DHCP Server' },
        { port: 69, proto: 'UDP', service: 'TFTP', cat: 'net', desc: 'Trivial FTP nạp firmware router/switch' },
        { port: 80, proto: 'TCP', service: 'HTTP', cat: 'web', desc: 'Giao thức truyền siêu văn bản Web không mã hóa' },
        { port: 110, proto: 'TCP', service: 'POP3', cat: 'mail', desc: 'Nhận thư điện tử từ mail server' },
        { port: 123, proto: 'UDP', service: 'NTP', cat: 'net', desc: 'Network Time Protocol đồng bộ thời gian chuẩn' },
        { port: 143, proto: 'TCP', service: 'IMAP', cat: 'mail', desc: 'Đồng bộ thư mục email trên nhiều thiết bị' },
        { port: 161, proto: 'UDP', service: 'SNMP', cat: 'net', desc: 'Giám sát thiết bị mạng & telemetry hạ tầng' },
        { port: 179, proto: 'TCP', service: 'BGP', cat: 'net', desc: 'Giao thức định tuyến vùng biên Internet Core' },
        { port: 389, proto: 'TCP/UDP', service: 'LDAP', cat: 'remote', desc: 'Truy vấn thư mục người dùng Active Directory' },
        { port: 443, proto: 'TCP', service: 'HTTPS', cat: 'web', desc: 'Giao thức truyền tải web bảo mật mã hóa SSL/TLS' },
        { port: 445, proto: 'TCP', service: 'SMB', cat: 'net', desc: 'Chia sẻ tệp tin và máy in Windows File Sharing' },
        { port: 465, proto: 'TCP', service: 'SMTPS', cat: 'mail', desc: 'SMTP bảo mật SSL gửi thư an toàn' },
        { port: 500, proto: 'UDP', service: 'IPsec ISAKMP', cat: 'vpn', desc: 'Thiết lập bắt tay bảo mật VPN IPsec IKE' },
        { port: 514, proto: 'UDP', service: 'Syslog', cat: 'net', desc: 'Thu thập log tập trung từ firewall & switch' },
        { port: 587, proto: 'TCP', service: 'SMTP Submission', cat: 'mail', desc: 'Gửi thư người dùng xác thực TLS' },
        { port: 636, proto: 'TCP', service: 'LDAPS', cat: 'remote', desc: 'LDAP bảo mật qua kênh SSL/TLS' },
        { port: 993, proto: 'TCP', service: 'IMAPS', cat: 'mail', desc: 'IMAP bảo mật SSL nhận thư mã hóa' },
        { port: 995, proto: 'TCP', service: 'POP3S', cat: 'mail', desc: 'POP3 bảo mật SSL' },
        { port: 1194, proto: 'UDP', service: 'OpenVPN', cat: 'vpn', desc: 'Cổng mặc định mạng riêng ảo OpenVPN' },
        { port: 1433, proto: 'TCP', service: 'MS SQL Server', cat: 'db', desc: 'Hệ quản trị cơ sở dữ liệu Microsoft SQL' },
        { port: 1521, proto: 'TCP', service: 'Oracle DB', cat: 'db', desc: 'Hệ quản trị cơ sở dữ liệu Oracle Database' },
        { port: 3306, proto: 'TCP', service: 'MySQL / MariaDB', cat: 'db', desc: 'Cơ sở dữ liệu phổ biến cho ứng dụng Web' },
        { port: 3389, proto: 'TCP/UDP', service: 'RDP', cat: 'remote', desc: 'Remote Desktop Protocol điều khiển máy tính từ xa' },
        { port: 5060, proto: 'TCP/UDP', service: 'SIP', cat: 'net', desc: 'Giao thức khởi tạo cuộc gọi VoIP / Tổng đài' },
        { port: 5432, proto: 'TCP', service: 'PostgreSQL', cat: 'db', desc: 'Cơ sở dữ liệu quan hệ mã nguồn mở mạnh mẽ' },
        { port: 5900, proto: 'TCP', service: 'VNC', cat: 'remote', desc: 'Điều khiển màn hình đồ họa máy chủ từ xa' },
        { port: 6379, proto: 'TCP', service: 'Redis', cat: 'db', desc: 'Cơ sở dữ liệu In-memory Cache siêu tốc' },
        { port: 8080, proto: 'TCP', service: 'HTTP Alternate', cat: 'web', desc: 'Cổng Web proxy, Tomcat, hoặc dev server' },
        { port: 8443, proto: 'TCP', service: 'HTTPS Alternate', cat: 'web', desc: 'Cổng quản trị HTTPS bảng điều khiển router/web' },
        { port: 9090, proto: 'TCP', service: 'Prometheus', cat: 'net', desc: 'Hệ thống thu thập số liệu metrics hạ tầng' },
        { port: 27017, proto: 'TCP', service: 'MongoDB', cat: 'db', desc: 'Cơ sở dữ liệu NoSQL dạng tài liệu JSON' },
        { port: 51820, proto: 'UDP', service: 'WireGuard VPN', cat: 'vpn', desc: 'Giao thức VPN thế hệ mới tốc độ cao mã hóa hiện đại' }
      ];

      let currentCat = 'all';

      function renderPorts() {
        const query = (searchInput.value || '').toLowerCase().trim();
        const filtered = PORTS_DATA.filter(item => {
          const matchCat = currentCat === 'all' || item.cat === currentCat;
          const matchQuery = !query ||
            item.port.toString().includes(query) ||
            item.service.toLowerCase().includes(query) ||
            item.proto.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query);
          return matchCat && matchQuery;
        });

        if (filtered.length === 0) {
          listContainer.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-dim);">Không tìm thấy cổng phù hợp với từ khóa!</div>';
          return;
        }

        listContainer.innerHTML = filtered.map(item => `
          <div class="port-item-card">
            <div class="port-badge">${item.port}</div>
            <div class="port-info">
              <div class="port-service">
                <span>${item.service}</span>
                <span class="port-proto">${item.proto}</span>
              </div>
              <div class="port-desc">${item.desc}</div>
            </div>
          </div>
        `).join('');
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCat = btn.getAttribute('data-filter');
          renderPorts();
        });
      });

      if (searchInput) searchInput.addEventListener('input', renderPorts);

      renderPorts();
    });
  </script>
</body>
</html>
