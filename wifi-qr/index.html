  <title>Tạo Mã QR Wi-Fi 1-Chạm — Thắng IT</title>
  <meta name="description" content="Tạo mã QR kết nối Wi-Fi nhanh chóng, tự động quét để kết nối trên iPhone và Android không cần nhập mật khẩu. Hỗ trợ chuẩn WPA, WPA2, WPA3 và mạng ẩn.">
  <meta name="keywords" content="tao qr wifi, wifi qr code, ket noi wifi khong can mat khau, thang it wifi qr">
  <meta name="author" content="Nguyễn Đức Thắng">

  <meta property="og:title" content="Tạo Mã QR Wi-Fi 1-Chạm — Thắng IT">
  <meta property="og:description" content="Tạo mã QR kết nối Wi-Fi chuẩn WPA/WPA2/WPA3. Quét kết nối tức thì trên iPhone/Android.">

  <meta property="og:url" content="https://thangit.com/wifi-qr/">
  <meta property="og:type" content="website">

</head>

      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </div>

  <header class="header-nav">
    <div class="container header-inner">
      <a href="/" class="brand-link" aria-label="Về Trang chủ">
        <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none" role="img" aria-label="TiT Logo">
          <defs>
            <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0b1320"/>
              <stop offset="100%" stop-color="#04070d"/>
            </linearGradient>
            <linearGradient id="tit-neon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="50%" stop-color="#7000ff"/>
              <stop offset="100%" stop-color="#ff007b"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="41" height="41" rx="10" fill="url(#tit-bg)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
          <g>
            <path d="M 6.5 15.2 H 16.5 M 11.5 15.2 V 29" stroke="url(#tit-neon)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 22 18.5 V 29" stroke="#00f0ff" stroke-width="3.4" stroke-linecap="round"/>
            <circle cx="22" cy="23.5" r="1.2" fill="#ffffff"/>
            <path d="M 27.5 15.2 H 37.5 M 32.5 15.2 V 29" stroke="url(#tit-neon)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <circle cx="22" cy="12" r="2.3" fill="#00f0ff"/>
        </svg>
        <span class="brand-name">THANG<span>IT</span>.COM</span>
      </a>

      <div class="topbar-actions">
        <a href="/" class="ios-back-btn" title="Quay lại Trang chủ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>Trang chủ</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-hub">
    <div class="container hub-center-wrapper">
      <div class="ios-app-view-container active" style="display:block;">
        <nav class="ios-app-navbar">
          <a href="/" class="ios-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Trang chủ</span>
          </a>
          <div class="ios-nav-center">
            <span class="ios-nav-icon">📶</span>
            <span>Tạo QR Wi-Fi 1-Chạm</span>
          </div>
          <div class="ios-nav-right"></div>
        </nav>

        <div class="ios-app-screen active">
          <div class="wifi-qr-layout">
            <div class="wifi-form-card">
              <div class="field-group" style="margin-bottom:0.75rem;">
                <label for="wifi-ssid" class="field-label" style="display:block; font-size:0.75rem; color:var(--text-dim); margin-bottom:0.25rem;">TÊN MẠNG (SSID):</label>
                <input type="text" id="wifi-ssid" class="input-compact" style="width:100%;" value="ThangIT_Network_5G" placeholder="Nhập tên Wi-Fi (SSID)">
              </div>
              <div class="field-group" style="margin-bottom:0.75rem;">
                <label for="wifi-password" class="field-label" style="display:block; font-size:0.75rem; color:var(--text-dim); margin-bottom:0.25rem;">MẬT KHẨU WI-FI:</label>
                <input type="text" id="wifi-password" class="input-compact" style="width:100%;" value="thangit@2026" placeholder="Nhập mật khẩu Wi-Fi">
              </div>
              <div class="field-group" style="margin-bottom:0.75rem;">
                <label for="wifi-encryption" class="field-label" style="display:block; font-size:0.75rem; color:var(--text-dim); margin-bottom:0.25rem;">CHUẨN BẢO MẬT:</label>
                <select id="wifi-encryption" class="input-compact" style="width:100%;">
                  <option value="WPA">WPA / WPA2 / WPA3 (Phổ biến nhất)</option>
                  <option value="WEP">WEP (Mạng cũ)</option>
                  <option value="nopass">Không có mật khẩu (Open Wi-Fi)</option>
                </select>
              </div>
              <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1rem;">
                <input type="checkbox" id="wifi-hidden" style="accent-color:var(--neon-cyan); cursor:pointer;">
                <label for="wifi-hidden" style="font-size:0.8rem; color:var(--text-muted); cursor:pointer;">Mạng ẩn (Hidden SSID)</label>
              </div>
              <button class="btn-calc" id="btn-gen-wifi-qr" style="width:100%;">⚡ Tạo Mã QR Wi-Fi</button>
            </div>

            <div class="wifi-preview-card">
              <div id="wifi-qr-render-area" class="wifi-qr-box">
                <canvas id="wifi-qr-canvas" width="200" height="200"></canvas>
              </div>
              <div style="display:flex; gap:0.5rem; width:100%; max-width:240px; margin-top:0.75rem;">
                <button class="btn-calc" id="btn-download-wifi-qr" style="flex:1; padding:0.5rem 0.6rem; font-size:0.75rem;">💾 Tải Ảnh PNG</button>
                <button class="btn-calc" id="btn-copy-wifi-string" style="flex:1; padding:0.5rem 0.6rem; font-size:0.75rem;">📋 Copy Text</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer-identity-link">
        Phát triển bởi <a href="https://thangnd.io.vn" target="_blank" rel="me">Thắng ND</a> • Cổng định danh cá nhân
      </p>
      <p class="footer-copyright">
        © 2026 <strong>Nguyễn Đức Thắng (Thắng IT)</strong> • 100% Static Web trên Cloudflare Pages
      </p>
    </div>
  </footer>

  <div class="toast-msg" id="global-toast">📋 Đã sao chép!</div>
  <script src="/js/qrcode.min.js?v=20260905_4"></script>
  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const ssidInput = document.getElementById('wifi-ssid');
      const passInput = document.getElementById('wifi-password');
      const encSelect = document.getElementById('wifi-encryption');
      const hiddenCheck = document.getElementById('wifi-hidden');
      const genBtn = document.getElementById('btn-gen-wifi-qr');
      const dlBtn = document.getElementById('btn-download-wifi-qr');
      const copyBtn = document.getElementById('btn-copy-wifi-string');
      const canvas = document.getElementById('wifi-qr-canvas');

      function buildWifiString() {
        const ssid = (ssidInput.value || '').trim();
        const pass = (passInput.value || '').trim();
        const enc = encSelect.value;
        const hidden = hiddenCheck.checked ? 'H:true;' : '';
        return `WIFI:S:${ssid};T:${enc};P:${pass};${hidden};`;
      }

      function generateQr() {
        const wifiStr = buildWifiString();
        if (window.TiTQR) {
          window.TiTQR.renderToCanvas(canvas, wifiStr, 200, {
            colorDark: '#04070d',
            colorLight: '#ffffff'
          });
          showToast('⚡ Đã tạo mã QR Wi-Fi thành công!');
        }
      }

      if (genBtn) genBtn.addEventListener('click', generateQr);

      if (dlBtn) {
        dlBtn.addEventListener('click', () => {
          const ssid = (ssidInput.value || 'wifi').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
          const link = document.createElement('a');
          link.download = `WiFi_QR_${ssid}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          showToast('📥 Đã tải ảnh mã QR Wi-Fi!');
        });
      }

      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const wifiStr = buildWifiString();
          navigator.clipboard.writeText(wifiStr).then(() => {
            showToast('📋 Đã sao chép chuỗi kết nối Wi-Fi!');
          });
        });
      }

      generateQr();
    });
  </script>
</body>
</html>
