<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <defs>
    <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="tit-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="tit-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes tit-border-scan {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -160; }
    }
    @keyframes tit-radar-pulse {
      0% {
        r: 2px;
        opacity: 0.9;
        stroke-width: 1.4px;
      }
      60% {
        opacity: 0.4;
      }
      100% {
        r: 9.5px;
        opacity: 0;
        stroke-width: 0.4px;
      }
    }
    @keyframes tit-beacon-core {
      0%, 100% {
        fill: #00ff9d;
        filter: drop-shadow(0 0 3px #00ff9d);
      }
      50% {
        fill: #00f0ff;
        filter: drop-shadow(0 0 6px #00f0ff);
      }
    }
    @keyframes tit-packet-flow {
      0% {
        cy: 19px;
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      75% {
        opacity: 1;
      }
      100% {
        cy: 31px;
        opacity: 0;
      }
    }
    @keyframes tit-letters-glow {
      0%, 100% {
        filter: drop-shadow(0 0 1px rgba(0, 240, 255, 0.4));
      }
      50% {
        filter: drop-shadow(0 0 4px rgba(0, 255, 157, 0.7));
      }
    }

    .tit-frame-base {
      fill: url(#tit-bg);
      stroke: rgba(0, 240, 255, 0.22);
      stroke-width: 1.2;
    }
    .tit-frame-scan {
      fill: none;
      stroke: url(#tit-neon);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 32 128;
      animation: tit-border-scan 4s linear infinite;
    }
    .tit-wave-1 {
      fill: none;
      stroke: #00ff9d;
      animation: tit-radar-pulse 2.2s cubic-bezier(0.1, 0.7, 0.3, 1) infinite;
    }
    .tit-wave-2 {
      fill: none;
      stroke: #00f0ff;
      animation: tit-radar-pulse 2.2s cubic-bezier(0.1, 0.7, 0.3, 1) infinite 1.1s;
    }
    .tit-beacon {
      animation: tit-beacon-core 2.2s ease-in-out infinite;
    }
    .tit-packet {
      fill: #ffffff;
      animation: tit-packet-flow 1.8s ease-in-out infinite;
    }
    .tit-letters {
      animation: tit-letters-glow 3s ease-in-out infinite;
    }
  </style>

  <!-- Cyber Badge Outer Frame -->
  <rect x="1.5" y="1.5" width="41" height="41" rx="10" class="tit-frame-base"/>
  
  <!-- Cyber Light Scanning Perimeter Beam -->
  <rect x="1.5" y="1.5" width="41" height="41" rx="10" class="tit-frame-scan"/>

  <!-- Subtle Inner Grid / Circuit lines -->
  <line x1="22" y1="4" x2="22" y2="8" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" stroke-dasharray="1 2"/>
  <line x1="22" y1="36" x2="22" y2="40" stroke="rgba(0, 255, 157, 0.3)" stroke-width="1" stroke-dasharray="1 2"/>

  <!-- Letters Group: T - i - T -->
  <g class="tit-letters">
    <!-- Left T -->
    <path d="M 6.5 13.5 H 17.5 V 17 H 13.5 V 30.5 H 10.5 V 17 H 6.5 Z" fill="url(#tit-neon)"/>
    
    <!-- Center i: Stem -->
    <rect x="20.5" y="18" width="3" height="12.5" rx="1.2" fill="#00f0ff"/>
    <!-- Packet pulsing through stem -->
    <circle cx="22" cy="24" r="1.2" class="tit-packet"/>

    <!-- Right T -->
    <path d="M 26.5 13.5 H 37.5 V 17 H 33.5 V 30.5 H 30.5 V 17 H 26.5 Z" fill="url(#tit-neon)"/>
  </g>

  <!-- Center i: Radar Transmission Waves (Expanding from antenna beacon) -->
  <circle cx="22" cy="12.5" r="2" class="tit-wave-1"/>
  <circle cx="22" cy="12.5" r="2" class="tit-wave-2"/>

  <!-- Center i: Antenna Beacon Dot -->
  <circle cx="22" cy="12.5" r="2.3" class="tit-beacon"/>
</svg>
