<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Trị Đồ Công Nghệ &amp; Affiliate | Thắng IT</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=20260907_v1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260907_v1">
  <link rel="shortcut icon" href="/favicon.ico?v=20260907_v1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260907_v1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #111827;
      --bg-input: #1e293b;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-cyan: #00f0ff;
      --accent-emerald: #10b981;
      --accent-rose: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .admin-header {
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-cyan);
    }

    .admin-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #04070d;
    }
    .btn-primary:hover {
      background: #38f8ff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.4);
    }

    .btn-success {
      background: #10b981;
      color: #fff;
    }
    .btn-success:hover {
      background: #059669;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: var(--border-color);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .admin-container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 16px;
      flex: 1;
    }

    .admin-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .admin-card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .product-table th {
      text-align: left;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
    }

    .product-table td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: middle;
    }

    .product-img-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      background: #fff;
    }

    .badge-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      padding: 22px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="brand-title">
      <i class="fas fa-microchip"></i>
      <span>Quản Trị Đồ Công Nghệ Affiliate — ThangIT</span>
    </div>
    <div class="admin-actions">
      <a href="/" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Về Trang Chủ
      </a>
      <button class="btn btn-success" id="btn-export-json">
        <i class="fas fa-download"></i> Tải File products.json
      </button>
    </div>
  </header>

  <main class="admin-container">
    <div class="admin-card">
      <div class="admin-card-title">
        <span>Danh Sách Sản Phẩm Đang Hiển Thị (<span id="count-products">0</span>)</span>
        <button class="btn btn-primary" id="btn-open-add-modal">
          <i class="fas fa-plus"></i> Thêm Sản Phẩm Mới
        </button>
      </div>

      <div style="overflow-x: auto;">
        <table class="product-table">
          <thead>
            <tr>
              <th style="width:60px;">Ảnh</th>
              <th>Tên Sản Phẩm</th>
              <th>Danh Mục</th>
              <th>Giá</th>
              <th>Tag Badge</th>
              <th style="width:120px; text-align:right;">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Thêm / Sửa Sản Phẩm -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-box">
      <h3 style="font-size:1.15rem; margin-bottom:16px;" id="modal-title">Thêm Sản Phẩm Mới</h3>
      <form id="product-form">
        <input type="hidden" id="prod-id">

        <div class="form-group">
          <label class="form-label">Tên Sản Phẩm *</label>
          <input type="text" id="prod-title" class="form-input" required placeholder="Ví dụ: Router Wi-Fi 6 AX3000">
        </div>

        <div class="form-group">
          <label class="form-label">Danh Mục</label>
          <select id="prod-category" class="form-input">
            <option value="network">📶 Mạng & Wi-Fi</option>
            <option value="workspace">🖥️ Góc Setup</option>
            <option value="accessories">🔌 Phụ Kiện IT</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Giá Bán Hiển Thị (VNĐ)</label>
          <input type="text" id="prod-price" class="form-input" placeholder="Ví dụ: 680.000đ">
        </div>

        <div class="form-group">
          <label class="form-label">Tag Nhãn (Badge)</label>
          <input type="text" id="prod-badge" class="form-input" placeholder="Ví dụ: Khuyên Dùng, Best Seller">
        </div>

        <div class="form-group">
          <label class="form-label">Link Ảnh Sản Phẩm (URL)</label>
          <input type="url" id="prod-image" class="form-input" required placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">Link Mua Hàng / Affiliate *</label>
          <input type="url" id="prod-url" class="form-input" required placeholder="https://shope.ee/...">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
          <button type="button" class="btn btn-secondary" id="btn-close-modal">Hủy Bỏ</button>
          <button type="submit" class="btn btn-primary">Lưu Sản Phẩm</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let productsData = { categories: [], items: [] };

    async function loadProducts() {
      try {
        const res = await fetch('/data/products.json?v=' + Date.now());
        if (res.ok) {
          productsData = await res.json();
          renderTable();
        }
      } catch (err) {
        console.error('Lỗi khi tải products.json', err);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('products-tbody');
      const countEl = document.getElementById('count-products');
      countEl.textContent = productsData.items.length;

      if (!productsData.items.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-sub);">Chưa có sản phẩm nào. Nhấn "+ Thêm Sản Phẩm Mới" để bắt đầu!</td></tr>`;
        return;
      }

      tbody.innerHTML = productsData.items.map((item, idx) => `
        <tr>
          <td><img src="${item.image}" alt="" class="product-img-thumb"></td>
          <td><strong>${item.title}</strong></td>
          <td><span class="badge-tag">${item.category}</span></td>
          <td style="color:#ffb800; font-weight:bold;">${item.price || 'Liên hệ'}</td>
          <td>${item.badge ? `<span class="badge-tag">${item.badge}</span>` : '—'}</td>
          <td style="text-align:right;">
            <button onclick="editProduct('${item.id}')" class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem;" title="Sửa">
              <i class="fas fa-edit"></i>
            </button>
            <button onclick="deleteProduct('${item.id}')" class="btn btn-secondary" style="padding:4px 8px; font-size:0.75rem; color:var(--accent-rose);" title="Xóa">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    const modal = document.getElementById('product-modal');
    const form = document.getElementById('product-form');

    document.getElementById('btn-open-add-modal').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Thêm Sản Phẩm Mới';
      form.reset();
      document.getElementById('prod-id').value = '';
      modal.classList.add('active');
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('prod-id').value;
      const title = document.getElementById('prod-title').value.trim();
      const category = document.getElementById('prod-category').value;
      const price = document.getElementById('prod-price').value.trim();
      const badge = document.getElementById('prod-badge').value.trim();
      const image = document.getElementById('prod-image').value.trim();
      const url = document.getElementById('prod-url').value.trim();

      if (id) {
        // Edit existing
        const target = productsData.items.find(x => x.id === id);
        if (target) {
          target.title = title;
          target.category = category;
          target.price = price;
          target.badge = badge;
          target.image = image;
          target.url = url;
        }
      } else {
        // Add new
        productsData.items.push({
          id: 'item-' + Date.now(),
          title,
          category,
          price,
          badge,
          image,
          url
        });
      }

      modal.classList.remove('active');
      renderTable();
    });

    window.editProduct = function(id) {
      const p = productsData.items.find(x => x.id === id);
      if (!p) return;
      document.getElementById('modal-title').textContent = 'Chỉnh Sửa Sản Phẩm';
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-title').value = p.title;
      document.getElementById('prod-category').value = p.category;
      document.getElementById('prod-price').value = p.price || '';
      document.getElementById('prod-badge').value = p.badge || '';
      document.getElementById('prod-image').value = p.image;
      document.getElementById('prod-url').value = p.url;
      modal.classList.add('active');
    };

    window.deleteProduct = function(id) {
      if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?')) {
        productsData.items = productsData.items.filter(x => x.id !== id);
        renderTable();
      }
    };

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(productsData, null, 2));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", "products.json");
      dlAnchorElem.click();
    });

    loadProducts();
  </script>
</body>
</html>
