  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const catSelect = document.getElementById('conv-cat-select');
      const unit1 = document.getElementById('conv-unit-1');
      const unit2 = document.getElementById('conv-unit-2');
      const val1 = document.getElementById('conv-val-1');
      const val2 = document.getElementById('conv-val-2');
      const btnSwap = document.getElementById('btn-conv-swap');

      let currencyRates = { USD: 1, VND: 26000, EUR: 0.86, JPY: 156, GBP: 0.74, CNY: 6.73, KRW: 1356, SGD: 1.26, THB: 32.9, AUD: 1.39 };

      const CATEGORIES = {
        currency: {
          units: {
            USD: { name: 'USD — Đô la Mỹ', factor: 1 },
            VND: { name: 'VND — Việt Nam Đồng', factor: 26000 },
            EUR: { name: 'EUR — Euro Châu Âu', factor: 0.86 },
            JPY: { name: 'JPY — Yên Nhật', factor: 156 },
            GBP: { name: 'GBP — Bảng Anh', factor: 0.74 },
            CNY: { name: 'CNY — Nhân dân tệ', factor: 6.73 },
            KRW: { name: 'KRW — Won Hàn Quốc', factor: 1356 },
            SGD: { name: 'SGD — Đô la Singapore', factor: 1.26 },
            THB: { name: 'THB — Baht Thái Lan', factor: 32.9 },
            AUD: { name: 'AUD — Đô la Úc', factor: 1.39 }
          }
        },
        data: {
          units: {
            B: { name: 'Byte (B)', factor: 1 },
            KB: { name: 'Kilobyte (KB)', factor: 1024 },
            MB: { name: 'Megabyte (MB)', factor: 1048576 },
            GB: { name: 'Gigabyte (GB)', factor: 1073741824 },
            TB: { name: 'Terabyte (TB)', factor: 1099511627776 },
            PB: { name: 'Petabyte (PB)', factor: 1125899906842624 }
          }
        },
        speed: {
          units: {
            Mbps: { name: 'Mbps (Gói mạng)', factor: 1 },
            MBs: { name: 'MB/s (Tải file thực tế)', factor: 8 },
            Kbps: { name: 'Kbps', factor: 0.001 },
            Gbps: { name: 'Gbps', factor: 1000 }
          }
        },
        length: {
          units: {
            m: { name: 'Mét (m)', factor: 1 },
            km: { name: 'Kilômét (km)', factor: 1000 },
            cm: { name: 'Centimét (cm)', factor: 0.01 },
            inch: { name: 'Inch (in)', factor: 0.0254 },
            ft: { name: 'Foot (ft)', factor: 0.3048 }
          }
        },
        mass: {
          units: {
            kg: { name: 'Kilôgam (kg)', factor: 1 },
            g: { name: 'Gam (g)', factor: 0.001 },
            lb: { name: 'Pound (lbs)', factor: 0.453592 }
          }
        },
        temp: {
          units: {
            C: { name: 'Độ C (°C)', factor: 1 },
            F: { name: 'Độ F (°F)', factor: 1 }
          }
        }
      };

      function populateUnits() {
        const cat = catSelect.value;
        const uList = CATEGORIES[cat].units;
        unit1.innerHTML = '';
        unit2.innerHTML = '';

        const keys = Object.keys(uList);
        keys.forEach((k, idx) => {
          const opt1 = document.createElement('option');
          opt1.value = k;
          opt1.textContent = uList[k].name;
          if (idx === 0) opt1.selected = true;
          unit1.appendChild(opt1);

          const opt2 = document.createElement('option');
          opt2.value = k;
          opt2.textContent = uList[k].name;
          if (idx === 1 || (idx === 0 && keys.length === 1)) opt2.selected = true;
          unit2.appendChild(opt2);
        });

        doConvert();
      }

      function doConvert() {
        const cat = catSelect.value;
        const v = parseFloat(val1.value) || 0;
        const u1 = unit1.value;
        const u2 = unit2.value;

        if (cat === 'temp') {
          if (u1 === u2) val2.value = v;
          else if (u1 === 'C' && u2 === 'F') val2.value = ((v * 9/5) + 32).toFixed(2);
          else if (u1 === 'F' && u2 === 'C') val2.value = (((v - 32) * 5) / 9).toFixed(2);
          return;
        }

        if (cat === 'currency') {
          const r1 = currencyRates[u1] || 1;
          const r2 = currencyRates[u2] || 1;
          const inUsd = v / r1;
          const out = inUsd * r2;
          val2.value = out > 100 ? Math.round(out).toLocaleString() : out.toFixed(4);
          return;
        }

        const f1 = CATEGORIES[cat].units[u1].factor;
        const f2 = CATEGORIES[cat].units[u2].factor;
        const base = v * f1;
        const out = base / f2;
        val2.value = out < 0.0001 ? out.toExponential(4) : parseFloat(out.toFixed(6));
      }

      catSelect.addEventListener('change', populateUnits);
      unit1.addEventListener('change', doConvert);
      unit2.addEventListener('change', doConvert);
      val1.addEventListener('input', doConvert);

      btnSwap.addEventListener('click', () => {
        const tmp = unit1.value;
        unit1.value = unit2.value;
        unit2.value = tmp;
        doConvert();
      });

      populateUnits();
    });
  </script>
