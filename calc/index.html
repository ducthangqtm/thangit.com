  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const display = document.getElementById('calc-display');
      const history = document.getElementById('calc-history');
      let currentVal = '0';
      let prevVal = null;
      let op = null;
      let shouldReset = false;

      function update() {
        display.textContent = currentVal;
      }

      function compute(a, b, operation) {
        a = parseFloat(a);
        b = parseFloat(b);
        if (operation === '+') return a + b;
        if (operation === '-') return a - b;
        if (operation === '*') return a * b;
        if (operation === '/') return b !== 0 ? a / b : 'Lỗi';
        if (operation === 'percent') return (a * b) / 100;
        return b;
      }

      document.querySelectorAll('.calc-key').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-key');

          if ('vibrate' in navigator) {
            try { navigator.vibrate(10); } catch {}
          }

          if (key >= '0' && key <= '9') {
            if (currentVal === '0' || shouldReset) {
              currentVal = key;
              shouldReset = false;
            } else {
              currentVal += key;
            }
            update();
          } else if (key === '.') {
            if (shouldReset) {
              currentVal = '0.';
              shouldReset = false;
            } else if (!currentVal.includes('.')) {
              currentVal += '.';
            }
            update();
          } else if (key === 'clear') {
            currentVal = '0';
            prevVal = null;
            op = null;
            history.textContent = '';
            update();
          } else if (key === 'del') {
            if (currentVal.length > 1) {
              currentVal = currentVal.slice(0, -1);
            } else {
              currentVal = '0';
            }
            update();
          } else if (['+', '-', '*', '/', 'percent'].includes(key)) {
            const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷', 'percent': '%' };
            if (prevVal !== null && op && !shouldReset) {
              const res = compute(prevVal, currentVal, op);
              currentVal = String(parseFloat(Number(res).toFixed(8)));
              update();
            }
            prevVal = currentVal;
            op = key;
            shouldReset = true;
            history.textContent = `${prevVal} ${symbols[key]}`;
          } else if (key === '=') {
            if (prevVal !== null && op) {
              const res = compute(prevVal, currentVal, op);
              history.textContent = `${prevVal} ${op} ${currentVal} =`;
              currentVal = String(parseFloat(Number(res).toFixed(8)));
              prevVal = null;
              op = null;
              shouldReset = true;
              update();
            }
          }
        });
      });
    });
  </script>
