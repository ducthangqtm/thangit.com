<head>
  <meta charset="UTF-8">

  <meta name="keywords" content="tao vietqr, vietqr studio, ma qr ngan hang, chuyen khoan vietqr, tao qr mb bank vietcombank, thang it">
  <meta name="author" content="Nguyễn Đức Thắng">
  <link rel="canonical" href="https://thangit.com/vietqr/">

  <meta property="og:title" content="Tạo Mã QR Ngân Hàng VietQR Miễn Phí — Thắng IT">
  <meta property="og:description" content="Tạo mã QR chuyển khoản VietQR chuẩn Napas 247 cho 40+ ngân hàng Việt Nam. Tải ảnh & copy miễn phí.">
  <meta property="og:image" content="https://thangit.com/assets/images/apple-touch-icon.png">
  <meta property="og:url" content="https://thangit.com/vietqr/">
  <meta property="og:type" content="website">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css?v=20260905_4">
</head>
<body>
  <div id="pwa-pull-indicator" class="pwa-pull-indicator" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </div>

  <header class="header-nav">
    <div class="container header-inner">
      <a href="/" class="brand-link" aria-label="Về Trang chủ">
        <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none" role="img" aria-label="TiT Logo">
          <defs>
            <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0b1320"/>
              <stop offset="100%" stop-color="#04070d"/>
            </linearGradient>
            <linearGradient id="tit-neon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="50%" stop-color="#7000ff"/>
              <stop offset="100%" stop-color="#ff007b"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="41" height="41" rx="10" fill="url(#tit-bg)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
          <g>
            <path d="M 6.5 15.2 H 16.5 M 11.5 15.2 V 29" stroke="url(#tit-neon)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 22 18.5 V 29" stroke="#00f0ff" stroke-width="3.4" stroke-linecap="round"/>
            <circle cx="22" cy="23.5" r="1.2" fill="#ffffff"/>
            <path d="M 27.5 15.2 H 37.5 M 32.5 15.2 V 29" stroke="url(#tit-neon)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <circle cx="22" cy="12" r="2.3" fill="#00f0ff"/>
        </svg>
        <span class="brand-name">THANG<span>IT</span>.COM</span>
      </a>

      <div class="topbar-actions">
        <a href="/" class="ios-back-btn" title="Quay lại Trang chủ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>Trang chủ</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-hub">
    <div class="container hub-center-wrapper">
      <div class="ios-app-view-container active" style="display:block;">
        <nav class="ios-app-navbar">
          <a href="/" class="ios-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Trang chủ</span>
          </a>
          <div class="ios-nav-center">
            <span class="ios-nav-icon">🏦</span>
            <span>VietQR Bank Studio</span>
          </div>
          <div class="ios-nav-right"></div>
        </nav>

        <div class="ios-app-screen active">
          <div class="qr-studio-layout">
            <div class="qr-form-group">
              <div style="margin-bottom:0.65rem;">
                <label for="qr-bank-select" style="font-size:0.75rem; color:var(--text-dim); display:block; margin-bottom:0.25rem;">NGÂN HÀNG THỤ HƯỞNG</label>
                <select id="qr-bank-select" class="input-compact" style="width:100%;">
                  <option value="mb" selected>MB Bank (Quân Đội)</option>
                  <option value="vcb">Vietcombank</option>
                  <option value="tcb">Techcombank</option>
                  <option value="bidv">BIDV</option>
                  <option value="vpb">VPBank</option>
                  <option value="acb">ACB</option>
                  <option value="tpb">TPBank</option>
                  <option value="icb">VietinBank</option>
                  <option value="ocb">OCB</option>
                  <option value="shb">SHB</option>
                  <option value="hdb">HDBank</option>
                  <option value="msb">MSB</option>
                  <option value="stb">Sacombank</option>
                  <option value="vib">VIB</option>
                  <option value="seab">SeABank</option>
                  <option value="lpb">LPBank</option>
                </select>
              </div>

              <div style="margin-bottom:0.65rem;">
                <label for="qr-bank-acc" style="font-size:0.75rem; color:var(--text-dim); display:block; margin-bottom:0.25rem;">SỐ TÀI KHOẢN:</label>
                <input type="text" id="qr-bank-acc" class="input-compact" style="width:100%;" value="0986192092" placeholder="Nhập số tài khoản ngân hàng">
              </div>

              <div style="display:flex; gap:0.5rem; margin-bottom:0.65rem;">
                <div style="flex:1;">
                  <label for="qr-bank-amount" style="font-size:0.75rem; color:var(--text-dim); display:block; margin-bottom:0.25rem;">SỐ TIỀN (VNĐ):</label>
                  <input type="number" id="qr-bank-amount" class="input-compact" style="width:100%;" placeholder="VD: 50000 (tùy chọn)">
                </div>
                <div style="flex:1;">
                  <label for="qr-bank-desc" style="font-size:0.75rem; color:var(--text-dim); display:block; margin-bottom:0.25rem;">NỘI DUNG:</label>
                  <input type="text" id="qr-bank-desc" class="input-compact" style="width:100%;" value="Thanh toan TiT" placeholder="VD: Mua hang">
                </div>
              </div>

              <button class="btn-calc" id="btn-generate-qr" style="width:100%; margin-top:0.5rem;">⚡ Tạo Mã VietQR</button>
            </div>

            <div class="qr-preview-group">
              <div class="qr-canvas-box" id="qr-display-box">
                <img id="qr-bank-img" src="https://img.vietqr.io/image/mb-0986192092-compact2.png?amount=&addInfo=Thanh%20toan%20TiT" alt="VietQR Code" style="max-width:240px; max-height:240px; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,0.5);">
              </div>

              <div style="display:flex; gap:0.5rem; margin-top:0.75rem; width:100%; max-width:260px;">
                <button class="btn-calc" id="btn-download-qr" style="flex:1; padding:0.5rem; font-size:0.75rem;">💾 Tải Ảnh QR</button>
                <button class="btn-calc" id="btn-copy-qr-text" style="flex:1; padding:0.5rem; font-size:0.75rem;">📋 Copy Link</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 <strong>Nguyễn Đức Thắng (Thắng IT)</strong> • 100% Static Web trên Cloudflare Pages
    </div>
  </footer>

  <div class="toast-msg" id="global-toast">📋 Đã sao chép!</div>
  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bankSelect = document.getElementById('qr-bank-select');
      const accInput = document.getElementById('qr-bank-acc');
      const amountInput = document.getElementById('qr-bank-amount');
      const descInput = document.getElementById('qr-bank-desc');
      const genBtn = document.getElementById('btn-generate-qr');
      const dlBtn = document.getElementById('btn-download-qr');
      const copyBtn = document.getElementById('btn-copy-qr-text');
      const qrImg = document.getElementById('qr-bank-img');

      function getVietQrUrl() {
        const bank = bankSelect.value || 'mb';
        const acc = (accInput.value || '').trim() || '0986192092';
        const amount = (amountInput.value || '').trim();
        const desc = encodeURIComponent((descInput.value || '').trim() || 'Thanh toan');
        return `https://img.vietqr.io/image/${bank}-${acc}-compact2.png?amount=${amount}&addInfo=${desc}`;
      }

      function updateQr() {
        const url = getVietQrUrl();
        qrImg.src = url;
        showToast('⚡ Đã cập nhật mã VietQR!');
      }

      if (genBtn) genBtn.addEventListener('click', updateQr);

      if (dlBtn) {
        dlBtn.addEventListener('click', async () => {
          const url = getVietQrUrl();
          try {
            const res = await fetch(url);
            const blob = await res.blob();
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `VietQR_${bankSelect.value}_${accInput.value}.png`;
            a.click();
            showToast('📥 Đã tải ảnh VietQR!');
          } catch {
            window.open(url, '_blank');
          }
        });
      }

      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const url = getVietQrUrl();
          navigator.clipboard.writeText(url).then(() => {
            showToast('📋 Đã sao chép đường dẫn VietQR!');
          });
        });
      }
    });
  </script>
</body>
</html>
