<body>
  <div id="pwa-pull-indicator" class="pwa-pull-indicator" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </div>

  <header class="header-nav">
    <div class="container header-inner">
      <a href="/" class="brand-link" aria-label="Về Trang chủ">
        <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none" role="img" aria-label="TiT Logo">
          <defs>
            <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0b1320"/>
              <stop offset="100%" stop-color="#04070d"/>
            </linearGradient>
            <linearGradient id="tit-neon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="50%" stop-color="#7000ff"/>
              <stop offset="100%" stop-color="#ff007b"/>
            </linearGradient>
          </defs>
          <rect x="1.5" y="1.5" width="41" height="41" rx="10" fill="url(#tit-bg)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
          <g>
            <path d="M 6.5 15.2 H 16.5 M 11.5 15.2 V 29" stroke="url(#tit-neon)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 22 18.5 V 29" stroke="#00f0ff" stroke-width="3.4" stroke-linecap="round"/>
            <circle cx="22" cy="23.5" r="1.2" fill="#ffffff"/>
            <path d="M 27.5 15.2 H 37.5 M 32.5 15.2 V 29" stroke="url(#tit-neon)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <circle cx="22" cy="12" r="2.3" fill="#00f0ff"/>
        </svg>
        <span class="brand-name">THANG<span>IT</span>.COM</span>
      </a>

      <div class="topbar-actions">
        <a href="/" class="ios-back-btn" title="Quay lại Trang chủ">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>Trang chủ</span>
        </a>
      </div>
    </div>
  </header>

  <main class="main-hub">
    <div class="container hub-center-wrapper">
      <div class="ios-app-view-container active" style="display:block;">
        <nav class="ios-app-navbar">
          <a href="/" class="ios-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Trang chủ</span>
          </a>
          <div class="ios-nav-center">
            <span class="ios-nav-icon">🪙</span>
            <span>Bảng Giá Coin Binance</span>
          </div>
          <div class="ios-nav-right">
            <button class="btn-calc" id="btn-refresh-crypto" style="padding:0.35rem 0.65rem; font-size:0.75rem;">Làm mới</button>
          </div>
        </nav>

        <div class="ios-app-screen active">
          <div class="crypto-grid" id="crypto-cards-grid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:0.85rem; margin-bottom:1.5rem;">
            <div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-dim);">Đang kết nối dữ liệu sàn Binance...</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 <strong>Nguyễn Đức Thắng (Thắng IT)</strong> • 100% Static Web trên Cloudflare Pages
    </div>
  </footer>

  <div class="toast-msg" id="global-toast">📋 Đã sao chép!</div>
  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('crypto-cards-grid');
      const refreshBtn = document.getElementById('btn-refresh-crypto');

      const COIN_META = {
        'BTCUSDT': { symbol: 'BTC', name: 'Bitcoin', icon: '₿', decimals: 2 },
        'ETHUSDT': { symbol: 'ETH', name: 'Ethereum', icon: 'Ξ', decimals: 2 },
        'SOLUSDT': { symbol: 'SOL', name: 'Solana', icon: '◎', decimals: 2 },
        'BNBUSDT': { symbol: 'BNB', name: 'BNB Chain', icon: '🟡', decimals: 2 },
        'XRPUSDT': { symbol: 'XRP', name: 'Ripple', icon: '✕', decimals: 4 },
        'DOGEUSDT': { symbol: 'DOGE', name: 'Dogecoin', icon: 'Ð', decimals: 4 },
        'ADAUSDT': { symbol: 'ADA', name: 'Cardano', icon: '₳', decimals: 4 },
        'SUIUSDT': { symbol: 'SUI', name: 'Sui Network', icon: '💧', decimals: 4 },
        'NEARUSDT': { symbol: 'NEAR', name: 'NEAR Protocol', icon: 'Ⓝ', decimals: 3 },
        'PEPEUSDT': { symbol: 'PEPE', name: 'Pepe Meme', icon: '🐸', decimals: 8 }
      };

      const SYMBOLS = Object.keys(COIN_META);
      const USD_VND_RATE = 26000;

      async function fetchCrypto() {
        try {
          const url = `https://api.binance.com/api/v3/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(SYMBOLS))}`;
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();

          container.innerHTML = data.map(item => {
            const meta = COIN_META[item.symbol];
            if (!meta) return '';

            const price = parseFloat(item.lastPrice);
            const change = parseFloat(item.priceChangePercent);
            const isUp = change >= 0;
            const sign = isUp ? '+' : '';
            const color = isUp ? 'var(--neon-green)' : '#ff4757';
            const vnd = Math.round(price * USD_VND_RATE).toLocaleString('vi-VN');

            return `
              <div class="port-item-card" style="padding:1rem; flex-direction:column; align-items:stretch; gap:0.4rem;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="display:flex; align-items:center; gap:0.5rem;">
                    <span style="font-size:1.3rem;">${meta.icon}</span>
                    <div>
                      <strong style="color:var(--text-title); font-size:0.95rem;">${meta.symbol}</strong>
                      <div style="font-size:0.75rem; color:var(--text-dim);">${meta.name}</div>
                    </div>
                  </div>
                  <span class="badge-pill" style="color:${color}; border-color:${color}; background:rgba(255,255,255,0.02); font-weight:700;">
                    ${sign}${change.toFixed(2)}%
                  </span>
                </div>
                <div style="margin-top:0.35rem;">
                  <div style="font-family:var(--font-mono); font-size:1.4rem; font-weight:800; color:var(--neon-cyan);">
                    $${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: meta.decimals })}
                  </div>
                  <div style="font-size:0.75rem; color:var(--text-dim); margin-top:0.15rem;">
                    ≈ ${vnd} đ
                  </div>
                </div>
              </div>
            `;
          }).join('');
        } catch {
          container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--text-dim);">Không thể tải dữ liệu Binance. Vui lòng thử lại!</div>';
        }
      }

      if (refreshBtn) refreshBtn.addEventListener('click', fetchCrypto);

      fetchCrypto();
      setInterval(fetchCrypto, 10000);
    });
  </script>
</body>
</html>
