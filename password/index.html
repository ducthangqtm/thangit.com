  <header class="header-nav">
    <div class="container header-inner">

        <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none" role="img" aria-label="TiT Logo">
          <defs>
            <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">

      <div class="topbar-actions">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>Trang chủ</span>

  <main class="main-hub">
    <div class="container hub-center-wrapper">
      <div class="ios-app-view-container active" style="display:block;">
        <nav class="ios-app-navbar">
          <a href="/" class="ios-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Trang chủ</span>
          </a>
          <div class="ios-nav-center">
            <span class="ios-nav-icon">🔐</span>
            <span>Sinh Mật Khẩu IT & Key</span>
          </div>
          <div class="ios-nav-right"></div>
        </nav>

        <div class="ios-app-screen active">
          <div class="subnet-control-card">
            <div class="pwd-result-box" id="pwd-result-box">
              <span id="pwd-result" class="pwd-result-text">Chưa tạo</span>
              <button class="btn-calc" id="btn-copy-pwd">Copy</button>
            </div>

            <div style="margin-top:1.25rem;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
                <label for="pwd-length" style="font-size:0.8rem; color:var(--text-dim); font-family:var(--font-mono);">ĐỘ DÀI MẬT KHẨU:</label>
                <span id="pwd-length-val" style="font-family:var(--font-mono); font-weight:800; color:var(--neon-cyan);">20 ký tự</span>
              </div>
              <input type="range" id="pwd-length" min="8" max="64" value="20" style="width:100%; accent-color:var(--neon-cyan); cursor:pointer;">
            </div>

            <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:0.5rem; margin-top:1rem;">
              <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
                <input type="checkbox" id="opt-upper" checked style="accent-color:var(--neon-cyan);"> Chữ hoa (A-Z)
              </label>
              <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
                <input type="checkbox" id="opt-lower" checked style="accent-color:var(--neon-cyan);"> Chữ thường (a-z)
              </label>
              <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
                <input type="checkbox" id="opt-numbers" checked style="accent-color:var(--neon-cyan);"> Số (0-9)
              </label>
              <label style="display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
                <input type="checkbox" id="opt-symbols" checked style="accent-color:var(--neon-cyan);"> Ký tự (!@#$%)
              </label>
            </div>

            <div class="subnet-pills-row" style="margin-top:1.25rem;">
              <button class="subnet-preset-btn" id="preset-wifi">📶 Wi-Fi (20 ký tự)</button>
              <button class="subnet-preset-btn" id="preset-secret">🛡️ Cisco Secret (32)</button>
              <button class="subnet-preset-btn" id="preset-hex">⚡ 128-bit Token Hex</button>
            </div>

            <button class="btn-calc" id="btn-gen-pwd" style="width:100%; margin-top:1.25rem; padding:0.65rem;">⚡ Tạo Mật Khẩu Mới</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 <strong>Nguyễn Đức Thắng (Thắng IT)</strong> • 100% Static Web trên Cloudflare Pages
    </div>
  </footer>

  <div class="toast-msg" id="global-toast">📋 Đã sao chép!</div>
  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pwdDisplay = document.getElementById('pwd-result');
      const lengthInput = document.getElementById('pwd-length');
      const lengthVal = document.getElementById('pwd-length-val');
      const btnGen = document.getElementById('btn-gen-pwd');
      const optUpper = document.getElementById('opt-upper');
      const optLower = document.getElementById('opt-lower');
      const optNumbers = document.getElementById('opt-numbers');
      const optSymbols = document.getElementById('opt-symbols');
      const btnPresetWifi = document.getElementById('preset-wifi');
      const btnPresetSecret = document.getElementById('preset-secret');
      const btnPresetHex = document.getElementById('preset-hex');

      const charsUpper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const charsLower = 'abcdefghijklmnopqrstuvwxyz';
      const charsNumbers = '0123456789';
      const charsSymbols = '!@#$%^&*()_+~`|}{[]:;?><,./-=';

      function generateSecureString(length, charset) {
        if (!charset) return '';
        const array = new Uint32Array(length);
        window.crypto.getRandomValues(array);
        let result = '';
        for (let i = 0; i < length; i++) {
          result += charset[array[i] % charset.length];
        }
        return result;
      }

      function generatePassword() {
        let charset = '';
        if (optUpper.checked) charset += charsUpper;
        if (optLower.checked) charset += charsLower;
        if (optNumbers.checked) charset += charsNumbers;
        if (optSymbols.checked) charset += charsSymbols;

        if (!charset) {
          showToast('⚠️ Vui lòng chọn ít nhất 1 loại ký tự!');
          return;
        }

        const len = parseInt(lengthInput.value, 10) || 20;
        pwdDisplay.textContent = generateSecureString(len, charset);
      }

      lengthInput.addEventListener('input', () => {
        lengthVal.textContent = `${lengthInput.value} ký tự`;
        generatePassword();
      });

      [optUpper, optLower, optNumbers, optSymbols].forEach(el => {
        el.addEventListener('change', generatePassword);
      });

      if (btnGen) btnGen.addEventListener('click', generatePassword);

      if (btnPresetWifi) {
        btnPresetWifi.addEventListener('click', () => {
          lengthInput.value = 20;
          lengthVal.textContent = '20 ký tự';
          optUpper.checked = true;
          optLower.checked = true;
          optNumbers.checked = true;
          optSymbols.checked = false;
          generatePassword();
          showToast('🔑 Đã tạo mật khẩu Wi-Fi (20 ký tự)!');
        });
      }

      if (btnPresetSecret) {
        btnPresetSecret.addEventListener('click', () => {
          lengthInput.value = 32;
          lengthVal.textContent = '32 ký tự';
          optUpper.checked = true;
          optLower.checked = true;
          optNumbers.checked = true;
          optSymbols.checked = true;
          generatePassword();
          showToast('🛡️ Đã tạo Cisco Secret (32 ký tự)!');
        });
      }

      if (btnPresetHex) {
        btnPresetHex.addEventListener('click', () => {
          lengthInput.value = 32;
          lengthVal.textContent = '32 ký tự';
          optUpper.checked = false;
          optLower.checked = true;
          optNumbers.checked = true;
          optSymbols.checked = false;
          pwdDisplay.textContent = generateSecureString(32, '0123456789abcdef');
          showToast('⚡ Đã tạo 128-bit Token Hex!');
        });
      }

      generatePassword();
    });
  </script>
</body>
</html>
