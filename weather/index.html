        <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none" role="img" aria-label="TiT Logo">
          <defs>
            <linearGradient id="tit-bg" x1="0%" y1="0%" x2="100%" y2="100%">

  <main class="main-hub">
    <div class="container hub-center-wrapper">
      <div class="ios-app-view-container active" style="display:block;">
        <nav class="ios-app-navbar">
          <a href="/" class="ios-back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            <span>Trang chủ</span>
          </a>
          <div class="ios-nav-center">
            <span class="ios-nav-icon">🌤️</span>
            <span>Thời Tiết Trực Tiếp</span>
          </div>
          <div class="ios-nav-right"></div>
        </nav>

        <div class="ios-app-screen active">
          <div class="weather-box" style="max-width:540px; margin:0 auto 1.5rem auto;">
            <div class="weather-city-selector" style="display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:1rem;">
              <button class="subnet-preset-btn active" data-city="hanoi">Hà Nội</button>
              <button class="subnet-preset-btn" data-city="hcm">TP.HCM</button>
              <button class="subnet-preset-btn" data-city="danang">Đà Nẵng</button>
              <button class="subnet-preset-btn" data-city="haiphong">Hải Phòng</button>
              <button class="subnet-preset-btn" data-city="cantho">Cần Thơ</button>
              <button class="subnet-preset-btn" data-city="dalat">Đà Lạt</button>
              <button class="subnet-preset-btn" id="btn-weather-gps" style="color:var(--neon-cyan); border-color:rgba(0,240,255,0.4);">📍 Vị Trí Tôi</button>
            </div>

            <div class="weather-current-card" style="padding:1.5rem; background:rgba(255,255,255,0.025); border-radius:12px; border:1px solid var(--border-subtle); margin-bottom:1rem;">
              <div style="display:flex; align-items:center; gap:1.25rem; margin-bottom:1.25rem;">
                <div id="weather-icon" style="font-size:3.5rem;">🌤️</div>
                <div>
                  <div id="weather-temp" style="font-size:2.8rem; font-weight:800; color:var(--text-title); font-family:var(--font-mono); line-height:1;">--°C</div>
                  <div id="weather-condition" style="font-size:1rem; color:var(--neon-cyan); font-weight:600; margin-top:0.25rem;">Đang tải...</div>
                  <div id="weather-city-title" style="font-size:0.85rem; color:var(--text-muted); margin-top:0.15rem;">Hà Nội, Việt Nam</div>
                </div>
              </div>

              <div class="subnet-output-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="sub-cell">
                  <span class="sub-cell-label">Độ Ẩm</span>
                  <span class="sub-cell-val" id="weather-humidity">--%</span>
                </div>
                <div class="sub-cell">
                  <span class="sub-cell-label">Tốc Độ Gió</span>
                  <span class="sub-cell-val" id="weather-wind">-- km/h</span>
                </div>
                <div class="sub-cell">
                  <span class="sub-cell-label">Chỉ Số UV</span>
                  <span class="sub-cell-val" id="weather-uv">--</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">

  <div class="toast-msg" id="global-toast">📋 Đã sao chép!</div>
  <script src="/js/core.js?v=20260905_4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cityBtns = document.querySelectorAll('[data-city]');
      const geoBtn = document.getElementById('btn-weather-gps');

      const CITIES = {
        hanoi: { lat: 21.0285, lon: 105.8542, name: 'Hà Nội' },
        hcm: { lat: 10.8231, lon: 106.6297, name: 'TP. Hồ Chí Minh' },
        danang: { lat: 16.0544, lon: 108.2022, name: 'Đà Nẵng' },
        haiphong: { lat: 20.8449, lon: 106.6881, name: 'Hải Phòng' },
        cantho: { lat: 10.0452, lon: 105.7469, name: 'Cần Thơ' },
        dalat: { lat: 11.9404, lon: 108.4583, name: 'Đà Lạt' }
      };

      const WMO_MAP = {
        0: { text: 'Trời quang đãng', icon: '☀️' },
        1: { text: 'Chủ yếu quang đãng', icon: '🌤️' },
        2: { text: 'Mây rải rác', icon: '⛅' },
        3: { text: 'Trời nhiều mây', icon: '☁️' },
        45: { text: 'Có sương mù', icon: '🌫️' },
        48: { text: 'Sương mù dày', icon: '🌫️' },
        51: { text: 'Mưa phùn nhẹ', icon: '🌦️' },
        53: { text: 'Mưa phùn vừa', icon: '🌦️' },
        55: { text: 'Mưa phùn nặng hạt', icon: '🌧️' },
        61: { text: 'Mưa rào nhẹ', icon: '🌦️' },
        63: { text: 'Mưa vừa', icon: '🌧️' },
        65: { text: 'Mưa to', icon: '🌧️' },
        80: { text: 'Mưa rào ngắt quãng', icon: '🌦️' },
        81: { text: 'Mưa rào nặng hạt', icon: '🌧️' },
        95: { text: 'Có dông sét', icon: '⛈️' }
      };

      async function fetchWeather(lat, lon, cityName) {
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=uv_index_max,precipitation_probability_max&timezone=Asia%2FBangkok`;
          const res = await fetch(url);
          if (!res.ok) return;
          const data = await res.json();
          const cur = data.current;
          const daily = data.daily;

          const code = cur.weather_code || 0;
          const wInfo = WMO_MAP[code] || { text: 'Trời mát mẻ', icon: '🌤️' };

          document.getElementById('weather-city-title').textContent = `${cityName}, Việt Nam`;
          document.getElementById('weather-temp').textContent = `${Math.round(cur.temperature_2m)}°C`;
          document.getElementById('weather-condition').textContent = wInfo.text;
          document.getElementById('weather-icon').textContent = wInfo.icon;
          document.getElementById('weather-humidity').textContent = `${cur.relative_humidity_2m}%`;
          document.getElementById('weather-wind').textContent = `${cur.wind_speed_10m} km/h`;

          const uvVal = daily && daily.uv_index_max ? daily.uv_index_max[0] : 4;
          document.getElementById('weather-uv').textContent = uvVal > 7 ? `${uvVal} (Rất Cao)` : (uvVal > 4 ? `${uvVal} (Trung Bình)` : `${uvVal} (Thấp)`);
        } catch (e) {
          console.warn('Weather fetch error:', e);
        }
      }

      cityBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          cityBtns.forEach(b => b.classList.remove('active'));
          if (geoBtn) geoBtn.classList.remove('active');
          btn.classList.add('active');

          const cKey = btn.getAttribute('data-city');
          const target = CITIES[cKey];
          if (target) fetchWeather(target.lat, target.lon, target.name);
        });
      });

      if (geoBtn) {
        geoBtn.addEventListener('click', () => {
          if (navigator.geolocation) {
            geoBtn.textContent = '📍 Đang lấy GPS...';
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                cityBtns.forEach(b => b.classList.remove('active'));
                geoBtn.classList.add('active');
                geoBtn.textContent = '📍 Vị Trí Tôi';
                fetchWeather(pos.coords.latitude, pos.coords.longitude, 'Vị Trí Của Bạn');
              },
              () => {
                geoBtn.textContent = '📍 GPS Bị Chặn';
                setTimeout(() => { geoBtn.textContent = '📍 Vị Trí Tôi'; }, 2000);
              }
            );
          }
        });
      }

      fetchWeather(CITIES.hanoi.lat, CITIES.hanoi.lon, CITIES.hanoi.name);
    });
  </script>
</body>
